server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - AddResponseHeader=X-Gateway, ASMAS
        - AddRequestHeader=X-Environment, QA

      routes:
        - id: auth-service
          uri: http://ec2-52-207-32-92.compute-1.amazonaws.com:8081
          predicates:
            - Path=/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: asmas-qa-secret-key-256-bits-minimum-length-123456
  expiration: 3600000
