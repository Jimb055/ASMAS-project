server:
  port: 8080

jwt:
  secret: my-secret-key-for-academic-project-123456

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: protected-services
          uri: http://localhost:8081
          predicates:
            - Path=/protected/**
          filters:
            - JwtAuthenticationFilter

management:
  endpoints:
    web:
      exposure:
        include: health,info
