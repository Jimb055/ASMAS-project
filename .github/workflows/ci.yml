name: CI Pipeline (QA)

on:
  push:
    branches:
      - qa

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my-turborepo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: my-turborepo/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run Turborepo build
        run: npx turbo run build

      - name: Build Docker image (api-gateway)
        run: docker build -t asmas-api-gateway ./apps/api-gateway
